name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          services/gateway/package-lock.json
          services/review-worker/package-lock.json

    - name: Install dependencies (Gateway)
      run: cd services/gateway && npm ci

    - name: Install dependencies (Review Worker)
      run: cd services/review-worker && npm ci

  build-java:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build with Gradle (Gate Service)
      run: cd services/gate-service && ./gradlew build -x test
