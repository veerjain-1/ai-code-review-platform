version: '3.8'

services:
  # ─── Kafka (Redpanda - lightweight, Kafka-compatible) ───
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: ai-review-kafka
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --default-log-level=warn
    ports:
      - "19092:19092"    # Kafka external
      - "18082:18082"    # Pandaproxy
      - "18081:18081"    # Schema Registry
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─── Redpanda Console (Kafka UI) ───
  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: ai-review-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8888:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
    restart: unless-stopped

  # ─── Create Kafka Topics on Startup ───
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: ai-review-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/bash
    command: |
      -c "
      rpk topic create code-review-requests --brokers redpanda:9092 --partitions 3 --replicas 1 &&
      rpk topic create review-results --brokers redpanda:9092 --partitions 3 --replicas 1 &&
      rpk topic create gate-check-requests --brokers redpanda:9092 --partitions 3 --replicas 1 &&
      rpk topic create gate-check-results --brokers redpanda:9092 --partitions 3 --replicas 1 &&
      echo 'Topics created successfully!'
      "

volumes:
  redpanda-data:
